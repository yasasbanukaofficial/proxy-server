name: deploy-caddy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup SSH and Proxy Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: mkdir -p /home/deploy/opt/proxy

      - name: Copy files to via SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          timeout: 60s
          command_timeout: 2m
          source: "docker-compose.yaml,Caddyfile"
          target: "/home/deploy/opt/proxy"

      - name: Start Docker Compose to run or reload Caddyfile
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd /home/deploy/opt/proxy
            docker compose up -d
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
