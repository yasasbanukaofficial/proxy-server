version: "1"
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_site:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - proxy

networks:
  proxy:
    external: true